<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; line-height: 1.55; }
    header { border-bottom: 1px solid #8886; margin-bottom: 24px; }
    h1 { font-size: 1.8rem; margin: 0 0 8px; }
    h2 { font-size: 1.2rem; margin-top: 28px; }
    .meta { color: #777; margin: 0 0 20px; }
    code, pre { font-family: ui-monospace, monospace; }
    pre { overflow-x: auto; padding: 16px; border: 1px solid #8886; border-radius: 6px; }
    a { color: #1769aa; }
    @media (prefers-color-scheme: dark) { a { color: #70b7ff; } .meta { color: #aaa; } }
  </style>
</head>
<body>
  <header>
    <h1>{{title}}</h1>
    <p class="meta">Updated {{updated_at}} · <a href="{{progress_href}}">Current progress</a></p>
  </header>
  <main>
    <section><h2>The problem</h2>{{problem}}</section>
    <section><h2>The working model</h2>{{working_model}}</section>
    <section><h2>Small example</h2>{{example}}</section>
    <section><h2>What changed</h2>{{change}}</section>
    <section><h2>Check your understanding</h2>{{checkpoint}}</section>
    <section><h2>Evidence</h2>{{evidence_links}}</section>
  </main>
</body>
</html>
