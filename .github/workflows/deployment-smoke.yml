name: Deployment smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-offline:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install current Claude Code and Codex CLIs
        run: npm install --global @anthropic-ai/claude-code @openai/codex

      - name: Validate rendered agent sources
        run: python3 scripts/render-agents.py --check

      - name: Exercise an offline sandboxed deployment
        run: scripts/smoke-test-deployment.sh --offline
